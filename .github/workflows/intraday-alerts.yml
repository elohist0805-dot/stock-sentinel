name: 盤中紀律監控與 Telegram 提醒
on:
  workflow_dispatch:
  schedule:
    # UTC 01:00-05:35, Taiwan 09:00-13:35. Some runs may be delayed.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 1-5 * * 1-5'
permissions:
  contents: read
concurrency:
  group: stock-intraday-notifications
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALERT_RULES_JSON: ${{ secrets.ALERT_RULES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore today's notification dedup state
        uses: actions/cache/restore@v4
        with:
          path: .private-alert-cache
          key: intraday-alert-state-${{ github.run_id }}
          restore-keys: |
            intraday-alert-state-
      - name: Check day high/low and send notifications if a target was touched
        run: python3 scripts/check_intraday_alerts.py
      - name: Save dedup state (private actions cache, not public pages)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .private-alert-cache
          key: intraday-alert-state-${{ github.run_id }}
