name: 更新台股官方盤後行情
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-quotes.yml'
  schedule:
    - cron: '15,45 0-10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stock-daily-quotes
  cancel-in-progress: false
jobs:
  update-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest official daily closes
        run: python3 scripts/update_quotes.py
      - name: Commit the public daily-close snapshot if changed
        run: |
          if ! git diff --quiet -- quotes.json || [ -n "$(git ls-files --others --exclude-standard quotes.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add quotes.json
            git commit -m "Update TWSE and TPEx daily close snapshot"
            git push
          fi
